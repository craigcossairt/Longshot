<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Longshot editor</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header>
      <div>
        <strong id="title">Longshot</strong>
        <div class="meta" id="meta"></div>
      </div>
      <div class="actions">
        <button id="copy">Copy</button>
        <button id="download">Download</button>
        <button class="primary" id="pdf">Save as PDF</button>
      </div>
    </header>
    <nav>
      <button data-tool="select" class="on">Select</button>
      <button data-tool="crop">Crop</button>
      <button data-tool="pen">Pen</button>
      <button data-tool="rect">Rect</button>
      <button data-tool="ellipse">Ellipse</button>
      <button data-tool="arrow">Arrow</button>
      <button data-tool="text">Text</button>
      <button data-tool="emoji">Stamp</button>
      <button data-tool="image">Image</button>
      <span class="swatches" id="swatches"></span>
      <button id="applyCrop" hidden>Apply crop</button>
    </nav>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
    </div>
    <div id="menu" class="menu" hidden>
      <button data-act="copy">Copy image</button>
      <button data-act="download">Download</button>
      <button data-act="pdf">Save as PDF</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden />
    <script src="pdf.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
