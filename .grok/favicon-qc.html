<!doctype html><html><head><style>

.row{display:flex;gap:20px;padding:20px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;font:11px sans-serif;color:#fff}
.box{background:#8c8b86;display:grid;place-items:center}
</style></head><body>

  <rect x="8" y="4.5" width="16" height="12.5" rx="2" fill="#17171a" stroke="#d2d6d0" stroke-width="2"/>
  <rect x="10.5" y="16.5" width="11" height="11.5" rx="1.2" fill="#d2d6d0"/>
</svg>
</div>16</div>
  <div class="cell"><div class="box" style="width:32px;height:32px"><svg width="32" height="32" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0e0e10"/>
  <rect x="8" y="4.5" width="16" height="12.5" rx="2" fill="#17171a" stroke="#d2d6d0" stroke-width="2"/>
  <rect x="10.5" y="16.5" width="11" height="11.5" rx="1.2" fill="#d2d6d0"/>
</svg>
</div>32</div>
  <div class="cell"><div class="box" style="width:64px;height:64px"><svg width="64" height="64" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0e0e10"/>
  <rect x="8" y="4.5" width="16" height="12.5" rx="2" fill="#17171a" stroke="#d2d6d0" stroke-width="2"/>
  <rect x="10.5" y="16.5" width="11" height="11.5" rx="1.2" fill="#d2d6d0"/>
</svg>
</div>64</div>
</div>
</body></html>
