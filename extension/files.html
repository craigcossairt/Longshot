<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Files</title>
    <link rel="icon" type="image/png" href="icons/icon48.png" />
    <link rel="stylesheet" href="shell.css" />
    <link rel="stylesheet" href="files.css" />
  </head>
  <body>
    <header class="shell">
      <a class="brand" href="editor.html">
        <img src="icons/icon48.png" alt="" />
        Longshot
      </a>
      <nav class="shell-nav">
        <a href="files.html" class="on" title="Files" aria-label="Files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="8" x2="21" y1="6" y2="6" />
            <line x1="8" x2="21" y1="12" y2="12" />
            <line x1="8" x2="21" y1="18" y2="18" />
            <line x1="3" x2="3.01" y1="6" y2="6" />
            <line x1="3" x2="3.01" y1="12" y2="12" />
            <line x1="3" x2="3.01" y1="18" y2="18" />
          </svg>
        </a>
        <a href="options.html" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </a>
      </nav>
    </header>
    <main>
      <div class="toolbar">
        <h1>Files</h1>
        <div class="toolbar-actions">
          <span id="count" class="count"></span>
          <button type="button" id="downloadBtn" disabled>Download</button>
          <button type="button" id="deleteBtn" class="danger" disabled>Delete</button>
        </div>
      </div>
      <p id="empty" class="empty" hidden>No captures yet.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="check"><input type="checkbox" id="selectAll" aria-label="Select all" /></th>
              <th>Capture</th>
              <th>Page</th>
              <th>Size</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
    <script src="history.js"></script>
    <script src="files.js"></script>
  </body>
</html>
