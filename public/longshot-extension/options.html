<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Longshot settings</title>
    <style>
      :root {
        --bg: #0e0e10;
        --fg: #f1f0ec;
        --muted: #8c8b86;
        --surface: #17171a;
        --border: #2a2a2e;
        --primary: #d2d6d0;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 Outfit, system-ui, sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; padding: 40px 20px 80px; }
      h1 { font-family: Georgia, serif; font-weight: 500; font-size: 36px; }
      label { display: block; margin: 18px 0 6px; font-weight: 500; }
      input[type="text"], input[type="number"], select {
        width: 100%; height: 44px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--surface); color: var(--fg); padding: 0 12px; font: inherit;
      }
      .row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin: 18px 0; }
      .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
      button {
        margin-top: 24px; height: 44px; padding: 0 16px; border-radius: 8px;
        border: 0; background: var(--primary); color: #0e0e10; font: 500 14px Outfit, sans-serif; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="hint" style="letter-spacing: 0.18em; text-transform: uppercase">Longshot</p>
      <h1>Settings</h1>
      <label>Image format</label>
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpeg">JPEG</option>
        <option value="webp">WebP</option>
      </select>
      <label>Quality (JPEG/WebP)</label>
      <input id="quality" type="number" min="0.5" max="1" step="0.02" />
      <label>Filename template</label>
      <input id="filenameTemplate" type="text" />
      <p class="hint">{title} {date} {datetime} {url} {width} {height}</p>
      <label>Download folder (inside Downloads)</label>
      <input id="downloadDirectory" type="text" />
      <div class="row">
        <div><strong>Scroll inner frames</strong><div class="hint">Expand iframes and framesets.</div></div>
        <input id="captureIframes" type="checkbox" />
      </div>
      <div class="row">
        <div><strong>Include browser bar</strong><div class="hint">Tabs and toolbar above the page.</div></div>
        <input id="includeBrowserBar" type="checkbox" />
      </div>
      <div class="row">
        <div><strong>Include URL</strong></div>
        <input id="includeUrlBar" type="checkbox" />
      </div>
      <div class="row">
        <div><strong>Auto-download</strong></div>
        <input id="autoDownload" type="checkbox" />
      </div>
      <div class="row">
        <div><strong>Show Save as dialog</strong></div>
        <input id="saveAsDialog" type="checkbox" />
      </div>
      <label>Max width (px)</label>
      <input id="maxWidth" type="number" />
      <label>Max height (px)</label>
      <input id="maxHeight" type="number" />
      <label>Scale percent</label>
      <input id="scalePercent" type="number" min="25" max="200" />
      <label>Max file size (MB, 0 = no limit)</label>
      <input id="maxFileMB" type="number" min="0" max="50" step="0.5" />
      <p class="hint">Captures larger than this are scaled down until they fit.</p>
      <button id="save">Save</button>
      <p class="hint" id="status"></p>
    </main>
    <script src="defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
