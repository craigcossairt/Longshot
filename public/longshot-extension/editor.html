<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Longshot editor</title>
    <link rel="icon" type="image/png" href="icons/icon48.png" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header>
      <div>
        <strong id="title">Longshot</strong>
        <div class="meta" id="meta"></div>
      </div>
      <div class="actions">
        <button id="clearAnns" class="icon" title="Clear annotations" aria-label="Clear annotations" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="m15 9-6 6" />
            <path d="m9 9 6 6" />
          </svg>
        </button>
        <button id="undo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7v6h6" />
            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 2.9L3 13" />
          </svg>
        </button>
        <button id="redo" class="icon" title="Redo (Ctrl+Y)" aria-label="Redo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 7v6h-6" />
            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6.7 2.9L21 13" />
          </svg>
        </button>
        <button id="copy">Copy</button>
        <button id="download">Download</button>
        <button class="primary" id="pdf">Save as PDF</button>
        <a href="files.html" class="icon" title="Files" aria-label="Files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M12 7v5l4 2" />
          </svg>
        </a>
        <button id="settings" class="icon" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </header>
    <nav>
      <button data-tool="select" class="icon on" title="Select" aria-label="Select">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" />
        </svg>
      </button>
      <button data-tool="crop" class="icon" title="Crop" aria-label="Crop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2v14a2 2 0 0 0 2 2h14" />
          <path d="M18 22V8a2 2 0 0 0-2-2H2" />
        </svg>
      </button>
      <button data-tool="pen" class="icon" title="Pen" aria-label="Pen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
          <path d="m15 5 4 4" />
        </svg>
      </button>
      <button data-tool="rect" class="icon" title="Rectangle" aria-label="Rectangle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="18" x="3" y="3" rx="2" />
        </svg>
      </button>
      <button data-tool="ellipse" class="icon" title="Ellipse" aria-label="Ellipse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
        </svg>
      </button>
      <button data-tool="arrow" class="icon" title="Arrow" aria-label="Arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 7h10v10" />
          <path d="M7 17 17 7" />
        </svg>
      </button>
      <button data-tool="text" class="icon" title="Text" aria-label="Text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="4 7 4 4 20 4 20 7" />
          <line x1="9" x2="15" y1="20" y2="20" />
          <line x1="12" x2="12" y1="4" y2="20" />
        </svg>
      </button>
      <button data-tool="emoji" class="icon" title="Stamp" aria-label="Stamp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M8 14s1.5 2 4 2 4-2 4-2" />
          <line x1="9" x2="9.01" y1="9" y2="9" />
          <line x1="15" x2="15.01" y1="9" y2="9" />
        </svg>
      </button>
      <button data-tool="image" class="icon" title="Image" aria-label="Image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
          <circle cx="9" cy="9" r="2" />
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
        </svg>
      </button>
      <span class="swatches" id="swatches"></span>
      <button id="deleteAnn" hidden>Delete</button>
      <button id="applyCrop" hidden>Apply crop</button>
      <div id="emojiPicker" class="panel emoji-picker" hidden>
        <p class="panel-title">Stamps</p>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
      <div class="nav-end">
        <button id="feedback" class="icon" title="Feedback" aria-label="Feedback">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
        </button>
        <div id="feedbackPanel" class="panel" hidden>
          <p class="panel-title">Feedback</p>
          <p class="hint">Sent privately. No email address is collected or shown.</p>
          <textarea id="feedbackBody" placeholder="What should we improve?" rows="5"></textarea>
          <p class="hint" id="feedbackStatus"></p>
          <div class="panel-actions">
            <button type="button" id="feedbackCancel">Cancel</button>
            <button type="button" class="primary" id="feedbackSubmit">Submit</button>
          </div>
        </div>
        <a
          class="icon"
          href="https://github.com/craigcossairt/Longshot"
          target="_blank"
          rel="noopener noreferrer"
          title="Star on GitHub"
          aria-label="Star on GitHub"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
          </svg>
        </a>
      </div>
    </nav>
    <div class="stage" id="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        <textarea id="textEdit" hidden spellcheck="false" placeholder="Type here"></textarea>
      </div>
    </div>
    <div id="menu" class="menu" hidden>
      <button data-act="copy">Copy image</button>
      <button data-act="download">Download</button>
      <button data-act="pdf">Save as PDF</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden />
    <script src="history.js"></script>
    <script src="feedback.js"></script>
    <script src="pdf.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
